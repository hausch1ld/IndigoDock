name: Windows release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: IndigoDock-Windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
      # Public releases remain paused until EVS signing is configured in CI.
      - name: Publish version once
        if: false
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release already exists; increment package version for a new update."; exit 0 }
          $files = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe','.blockmap' -or $_.Name -eq 'latest.yml' } | ForEach-Object FullName
          gh release create $tag @files --target $env:GITHUB_SHA --title "IndigoDock $version" --notes "Windows x64. Installer und portable Version. Profil bleibt unter %APPDATA%\multidock erhalten. Spotify-DRM ist zurückgestellt. Nicht mit einem Herausgeberzertifikat signiert."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

